<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Reserva</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Controle de Estacionamento</h1>

        <nav>
            <a href="index.html">Vagas</a>
            <a href="cadastro.html">Cadastrar Reserva</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cadastro de Reserva</h2>

            <form id="form-reserva">
                <div class="campo">
                    <label for="placa">Placa do Veículo</label>
                    <input type="text" id="placa" name="placa" maxlength="7" placeholder="ABC1D23" required>
                </div>

                <div class="campo">
                    <label for="proprietario">Nome do Proprietário</label>
                    <input type="text" id="proprietario" name="proprietario" required>
                </div>

                <div class="campo">
                    <label for="apartamento">Número do Apartamento</label>
                    <input type="text" id="apartamento" name="apartamento" required>
                </div>

                <div class="campo">
                    <label for="bloco">Bloco do Apartamento</label>
                    <input type="text" id="bloco" name="bloco" required>
                </div>

                <div class="campo">
                    <label for="modelo">Modelo do Veículo</label>
                    <input type="text" id="modelo" name="modelo" required>
                </div>

                <div class="campo">
                    <label for="cor">Cor do Veículo</label>
                    <input type="text" id="cor" name="cor" required>
                </div>

                <div class="campo">
                    <label for="vaga">Número da Vaga</label>
                    <select id="vaga" name="vaga" required>
                        <option value="">Selecione uma vaga</option>
                    </select>
                </div>

                <div class="acoes">
                    <button type="submit">Salvar Reserva</button>
                    <a href="index.html">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <script src="js/model.js"></script>
    <script src="js/view.js"></script>
    <script src="js/controller.js"></script>

</body>

</html>
